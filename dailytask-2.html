<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1 align="center">Student Registration Form</h1>
    <label> <strong>Roll.no :</strong></label>
    <input type="text"><br><br>

    <label> <strong> Student name :</strong></label>
    <input type="text" placeholder="First name" >
    <label><strong> - </strong></label>
    <input type="text" placeholder="Last name"><br><br>

    <label> <Strong> Father's Name :</Strong></label>
    <input type="text"><br><br>

    <label><strong>Date of birth : </strong></label>
    <input type="date">
    <label> <strong><i>(DD-MM-YYYY)</i></strong></label><br><br>

    <label> <strong> Mobile no. :</strong></label>
    <input type="text" name="country_code" value="+91" style="width: 50px; text-align: center;">
    <label><strong> - </strong></labe l>
    <input type="number" name="number"><br><br>

    <label> <strong>Email id :</strong></label>
    <input type="email" name="email"><br><br>

    <label><strong>Password : </strong></label>
    <input type="password" name="password"><br><br>

    <label><strong>Gender : </strong></label>
    <input type="radio" name="Gender">
    <label ><strong>Male</strong></label>
    <input type="radio" name="Gender">
    <label><strong>Female</strong></label><br><br>

    <label> <strong>Department : </strong></label>
    <input type="checkbox" name="Department" >
    <label><strong>CSE</strong></label>
    <input type="checkbox" name="Department" >
    <label><strong>IT</strong></label>
    <input type="checkbox" name="Department" >
    <label><strong>ECE</strong></label>
    <input type="checkbox" name="Department" >
    <label><strong>Civil</strong></label>
    <input type="checkbox" name="Department" >
    <label><strong>Mech</strong></label><br><br>

    <label><strong>Cource :</strong></label>
    <select name="Cource">
        <option >----------------- Select Current Course's -----------------</option>
        <option >B.Tech</option>
        <option >M.Tech</option>
        <option >BCA</option>
        <option >MCA</option>
    </select><br><br>

    <label><strong>Student photo :</strong></label>
    <input type="file" name="Student photo" accept="image/*"><br><br>   

    <label><Strong>City :</Strong></label>
    <input type="text" name="City"><br><br>

    <label><strong>Address :</strong></label>
    <textarea name="Address"></textarea>

</body>
</html>
